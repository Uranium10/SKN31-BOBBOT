name: Daily Menu Discord Bot

on:
  schedule:
    # KST 09:00 = UTC 00:00 (월~금요일 평일만 실행)
    - cron: '5 2 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

jobs:
  send_menu:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v3
      
    - name: Python 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: 필요한 패키지 설치
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        
    - name: 스크래핑 및 웹훅 전송 스크립트 실행
      env:
        # 깃허브 시크릿에 등록한 웹훅 URL을 환경 변수로 전달
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python main.py